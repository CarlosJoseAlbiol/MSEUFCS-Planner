<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MSEUF Concert Singers Calendar</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--gold:#f0c53f;--gold2:#c99a1c;--ink:#f6ece8;--mut:#c4aaa3;--panel:rgba(43,5,7,.88);--line:rgba(212,166,42,.35);--ok:#7fd9a1;--bad:#ff8f86;--warn:#ffc266;--serif:"Cormorant Garamond",Georgia,serif}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;min-height:100vh;font:15px/1.5 Figtree,system-ui,sans-serif;color:var(--ink);background:radial-gradient(120% 90% at 20% 0%,#751019 0%,#4a0a10 40%,#250305 100%) fixed}
body::after{content:"";position:fixed;right:-140px;bottom:-80px;width:520px;height:520px;background:url(logo.jpg) center/cover;border-radius:50%;opacity:.16;mix-blend-mode:screen;pointer-events:none}
#login,#shell{position:relative;z-index:1}
a{color:var(--gold)}
h2{font:600 32px var(--serif);color:var(--gold);margin:0}h3{font:600 24px var(--serif);color:var(--gold);margin:0 0 8px}h4{margin:10px 0 4px;font-size:13px;color:var(--gold)}
.sub{margin:2px 0 0;color:var(--mut)}small,.hint{color:var(--mut)}.empty{color:var(--mut);padding:20px 0}
.lines{height:30px;margin:14px 0;background:repeating-linear-gradient(to bottom,rgba(240,197,63,.4) 0 1px,transparent 1px 7px)}
/* login */
#login{min-height:100vh;display:grid;grid-template-columns:1fr 1fr;align-items:center}
.hero{text-align:center;padding:32px}.hero img{width:250px;height:250px;border-radius:50%;object-fit:cover;border:3px solid var(--gold2);box-shadow:0 0 0 12px rgba(212,166,42,.13)}
.hero h1{font:600 46px var(--serif);color:var(--gold);margin:26px 0 0}.hero .lines{width:340px;max-width:80%;margin:14px auto}.hero p{max-width:320px;margin:0 auto;color:var(--mut)}
.lr{min-height:100vh;display:grid;place-items:center;border-left:1px solid var(--line);padding:24px}
.lcard{width:min(440px,100%);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:26px}
.seg{display:flex;border:1px solid var(--line);border-radius:999px;padding:3px;margin:14px 0}
.seg button{flex:1;border:0;background:none;color:var(--gold);font-weight:700;border-radius:999px;padding:9px 6px}
.seg button.on{background:linear-gradient(#f7da72,#d9a82a);color:#2a0305}
.err{color:var(--bad);min-height:1.2em;margin:10px 0 0}
.between{justify-content:space-between;font-size:14px}
/* app */
header{background:rgba(26,3,5,.92);border-bottom:1px solid var(--line);padding:8px 18px;display:flex;gap:12px;align-items:center}
.logo{width:42px;height:42px;border-radius:50%;object-fit:cover;border:2px solid var(--gold2)}
header h1{font:700 19px var(--serif);color:var(--gold);margin:0;line-height:1.1}header p{margin:0;font-size:12px;color:var(--mut)}
#who{margin-left:auto;display:flex;gap:12px;align-items:center;text-align:right;font-size:13px}.who b{display:block}
nav{display:flex;gap:6px;padding:10px 18px 0;overflow-x:auto;max-width:1100px;margin:0 auto}
nav button{border:0;background:none;color:var(--mut);padding:10px 14px;font-weight:600;border-bottom:3px solid transparent;white-space:nowrap;border-radius:0}
nav button.on{color:var(--gold);border-color:var(--gold)}
#bar{max-width:1100px;margin:0 auto;padding:10px 18px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--mut)}
main{max-width:1100px;margin:0 auto;padding:10px 18px 60px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:8px 0}.row>.sp{flex:1}
button{font:inherit;border:1px solid var(--line);background:transparent;color:var(--gold);border-radius:999px;padding:6px 14px;cursor:pointer;font-weight:600}
button:hover{border-color:var(--gold)}
button.pri,button.gold{background:linear-gradient(#f7da72,#d9a82a);color:#2a0305;border-color:#d9a82a;padding:9px 20px}
button.wide{width:100%;margin-top:6px;padding:12px}button.link{border:0;padding:0;color:var(--ink);text-align:left}button.link:hover{color:var(--gold)}
input,select,textarea{font:inherit;color:var(--ink);background:#1c0305;border:1px solid var(--line);border-radius:8px;padding:9px 11px;max-width:100%}
input::placeholder{color:#8f7872}input[type=checkbox]{accent-color:var(--gold)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.card,.day,.line,.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px}
.card{padding:14px 18px;margin:12px 0}.card p{margin:6px 0}.card b{font-size:16px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:12px 0 18px}
.stat{padding:14px 18px;color:var(--mut)}.stat b{display:block;font:600 38px var(--serif);color:var(--gold);line-height:1.1}
.tag{border:1px solid var(--gold2);color:var(--gold);border-radius:999px;padding:1px 10px;font-size:12px;font-weight:600}
.ok,.s-yes,.s-free{color:var(--ok);font-weight:600}.bad,.s-no{color:var(--bad);font-weight:600}.s-busy{color:var(--warn);font-weight:600}
.me{background:rgba(0,0,0,.25);border-radius:10px;padding:10px 12px;margin:10px 0}
details summary{cursor:pointer;color:var(--gold);font-weight:600}
.day{padding:10px 16px;margin:10px 0}.cls{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;padding:6px 0;border-top:1px dashed var(--line)}.cls span:last-child{margin-left:auto}
.line{padding:8px 14px}.line.sel{border-color:var(--gold)}.line>.link{min-width:220px}
dialog{background:#2b0507;color:var(--ink);border:1px solid var(--gold2);border-radius:14px;padding:20px;width:min(440px,94vw)}dialog::backdrop{background:#000a}
label{display:block;margin:8px 0;font-size:13px;color:var(--mut)}#bar label,.row label{display:inline-flex;gap:6px;align-items:center;margin:0}
.lcard input:not([type=checkbox]),dialog input:not([type=checkbox]),dialog select,dialog textarea{width:100%;display:block;margin-top:4px}
.days label{display:inline-flex;gap:4px;align-items:center;margin-right:8px;color:var(--ink)}
#toast{position:fixed;bottom:16px;left:50%;transform:translate(-50%,90px);background:var(--gold);color:#2a0305;font-weight:600;padding:10px 18px;border-radius:999px;transition:.2s;max-width:90vw;z-index:9}#toast.show{transform:translate(-50%,0)}
@media(max-width:800px){#login{grid-template-columns:1fr}.lr{border-left:0;min-height:0}.hero img{width:170px;height:170px}.hero h1{font-size:36px}#who .who{display:none}}
@media(prefers-reduced-motion:reduce){#toast{transition:none}}

/* ---------- motion (same feel as the grading sheet) ---------- */
@keyframes rise{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes dropin{from{opacity:0;transform:translateY(-100%)}to{opacity:1;transform:none}}
@keyframes drawline{from{opacity:0;transform:scaleX(0)}to{opacity:1;transform:scaleX(1)}}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.97)}to{opacity:1;transform:none}}
@keyframes glow{0%,100%{box-shadow:0 0 0 12px rgba(212,166,42,.13)}50%{box-shadow:0 0 0 18px rgba(212,166,42,.22)}}
.seg{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:3px}
.seg::before{content:"";position:absolute;top:3px;bottom:3px;left:3px;width:calc(50% - 4.5px);border-radius:999px;background:linear-gradient(#f7da72,#d9a82a);transition:transform .45s cubic-bezier(.22,.8,.24,1)}
.seg[data-active=staff]::before{transform:translateX(calc(100% + 3px))}
.seg button{position:relative;z-index:1;flex:none;background:none!important;transition:color .3s}
.seg button[aria-pressed=true]{color:#2a0305}
.lcard>*{transition:opacity .3s,transform .4s cubic-bezier(.22,.8,.24,1)}
.lcard.swap-out>*:not(.seg){opacity:0;transform:translateY(8px);transition-duration:.17s}
.lcard{animation:rise .7s .15s cubic-bezier(.22,.8,.24,1) both}
#lbody>*{animation:fade .35s ease both}
#login:not([hidden]) .hero>*{animation:rise .7s cubic-bezier(.22,.8,.24,1) both}
.hero>:nth-child(2){animation-delay:.1s!important}.hero>:nth-child(3){animation:drawline 1s .25s ease-out both!important}
.hero img{animation:rise .7s both,glow 5s ease-in-out 1s infinite!important}
#shell:not([hidden]){animation:fade .6s ease both}
#shell:not([hidden]) header{animation:dropin .55s cubic-bezier(.22,.8,.24,1) both}
#app.leaving{opacity:0;transform:translateY(-12px);transition:opacity .19s ease,transform .19s ease}
#app.enter>*{animation:rise .75s cubic-bezier(.22,.8,.24,1) both;animation-delay:calc(var(--i,0)*80ms)}
#app.enter>.lines{transform-origin:left center;animation:drawline 1s ease-out both;animation-delay:calc(var(--i,0)*80ms)}
#app.enter .stat,#app.enter .card,#app.enter .day,#app.enter .line{animation:rise .55s cubic-bezier(.22,.8,.24,1) both;animation-delay:calc(200ms + var(--j,0)*70ms)}
nav button{transition:color .25s,border-color .25s}
.stat,.card,.line,.day{transition:transform .2s,border-color .2s}.stat:hover{transform:translateY(-3px);border-color:var(--gold)}.card:hover,.line:hover,.day:hover{border-color:var(--gold)}
button{transition:background .2s,color .2s,border-color .2s,transform .15s,box-shadow .2s}button.pri:hover,button.gold:hover{box-shadow:0 6px 22px rgba(219,150,0,.4);transform:translateY(-1px)}
dialog[open]{animation:pop .4s cubic-bezier(.22,.8,.24,1) both}dialog[open]::backdrop{animation:fade .2s ease both}
@media(prefers-reduced-motion:reduce){*,*::before{animation:none!important;transition:none!important}}

/* ---------- weekly calendar ---------- */
.calwrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
.cal{display:grid;grid-template-columns:64px repeat(7,minmax(118px,1fr));min-width:900px}
.cal .h{background:#4a0a10;padding:8px 4px;text-align:center;font-weight:700;font-size:13px;border-bottom:1px solid var(--line)}
.cal .h small{display:block;font-weight:500;color:inherit;opacity:.8}.cal .h.today{color:#2a0305;background:linear-gradient(#f7da72,#d9a82a)}
.cal .tm{position:relative;border-right:1px solid var(--line)}.cal .tm span{position:absolute;right:6px;transform:translateY(-50%);font-size:11px;color:var(--mut)}
.cal .col{position:relative;border-left:1px solid rgba(212,166,42,.15);background-image:repeating-linear-gradient(to bottom,rgba(212,166,42,.16) 0 1px,transparent 1px 60px)}
.cal .col.today{background-color:rgba(240,197,63,.07)}
.blk{position:absolute;left:3px;right:3px;z-index:1;border-radius:6px;border-left:3px solid var(--c);background:color-mix(in srgb,var(--c) 24%,#2b0507);padding:3px 6px;font-size:11px;line-height:1.25;overflow:hidden}
.blk b{display:block;font-size:12px}
.blk.ev{left:36%;z-index:3;background:linear-gradient(#f7da72,#d9a82a);color:#2a0305;border:0;box-shadow:0 2px 8px #0007}.blk.ev.clash{outline:2px solid var(--bad)}
.now{position:absolute;left:0;right:0;height:2px;background:var(--bad);z-index:4}.now::before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--bad)}
.live{display:inline-flex;gap:6px;align-items:center;font-size:12px;color:var(--ok)}.live::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ok);animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.up .bt{display:inline-block;border-radius:999px;padding:9px 20px;background:linear-gradient(#f7da72,#d9a82a);color:#2a0305;font-weight:600;cursor:pointer}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.thumb{height:110px;border-radius:8px;border:1px solid var(--line);cursor:pointer}
</style></head><body>
<div id="login" hidden><section class="hero"><img src="logo.jpg" alt="MSEUF Concert Singers logo"><h1>MSEUF Concert Singers Calendar</h1><div class="lines"></div></section><section class="lr"><div class="lcard" id="lcard"><h2 id="ltitle"></h2><div class="seg" id="lseg" data-active="trainee"><button type="button" data-g="trainee">Trainee</button><button type="button" data-g="staff">Master / Senior Member</button></div><div id="lbody"></div></div></section></div>
<div id="shell" hidden><header><img class="logo" src="logo.jpg" alt="" onerror="this.remove()"><div><h1>MSEUF Concert Singers Calendar</h1></div><div id="who"></div></header>
<nav id="tabs"></nav><div id="bar"></div><main id="app"></main></div><dialog id="dlg"></dialog><div id="toast" role="status"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
// ====== 1. PASTE YOUR FIREBASE CONFIG (Project settings → Your apps → Web app) ======
const firebaseConfig={apiKey:"AIzaSyAVmZRNPRF5vozc9q3vSwNQjOSDRYtLuxI",authDomain:"mseuf-grading-sheet.firebaseapp.com",projectId:"mseuf-grading-sheet",storageBucket:"mseuf-grading-sheet.firebasestorage.app",messagingSenderId:"548651789448",appId:"1:548651789448:web:94af671a75e00dff14033d"};

firebase.initializeApp(firebaseConfig);
const db=firebase.firestore(),auth=firebase.auth();
const DAYS=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"],CODE={M:1,T:2,W:3,Th:4,F:5,S:6};
const ROLES={trainee:"Trainee",member:"Member",senior:"Senior member",mi:"Master of Initiation"};
const ROLE_AUTH={master:"Master of Initiation",senior:"Senior Member"};
const LBL={yes:"Available (confirmed)",free:"Available",busy:"Class conflict",no:"Not available"};
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const t2m=t=>{const[h,m]=t.split(":");return +h*60+ +m};
const t12=t=>{let[h,m]=t.split(":");h=+h;return(h%12||12)+":"+m+(h<12?" AM":" PM")};
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const dstr=s=>new Date(s+"T00:00").toLocaleDateString("en-PH",{weekday:"short",month:"short",day:"numeric",year:"numeric"});
const opts=(o,sel)=>Object.entries(o).map(([k,v])=>`<option value="${k}" ${k===sel?"selected":""}>${v}</option>`).join("");
const fld=(l,n,v,t="text",r)=>`<label>${l}<input name="${n}" type="${t}" value="${esc(v)}" ${r?"required":""}></label>`;
const parseDays=s=>[...s.matchAll(/Th|M|T|W|F|S/g)].map(m=>CODE[m[0]]);

let people=[],events=[],role=null,user=null,profile=null,tab="events",me=localStorage.getItem("me")||"",viewPid="",showPast=false;
const tmr=new Date();tmr.setDate(tmr.getDate()+1);
let f={date:iso(tmr),start:"16:00",end:"18:00",aud:"trainee"};

function toast(m){const t=$("#toast");t.textContent=m;t.className="show";clearTimeout(toast.t);toast.t=setTimeout(()=>t.className="",3500)}
const openDlg=h=>{$("#dlg").style.width="";$("#dlg").innerHTML=h;$("#dlg").showModal()},closeDlg=()=>$("#dlg").close();
const fail=e=>toast(e.message||String(e));
const reduceMotion=matchMedia("(prefers-reduced-motion: reduce)").matches,wait=ms=>new Promise(r=>setTimeout(r,ms));
function morph(el,change){
  if(reduceMotion)return change();
  const h0=el.offsetHeight;change();const h1=el.offsetHeight;if(Math.abs(h0-h1)<2)return;
  el.style.height=h0+"px";el.style.overflow="hidden";el.getBoundingClientRect();
  el.style.transition="height .5s cubic-bezier(.22,.8,.24,1)";el.style.height=h1+"px";
  setTimeout(()=>{el.style.height=el.style.overflow=el.style.transition=""},560);
}
let enterTimer;
function countUp(m){m.querySelectorAll(".stat b").forEach(el=>{const t=el.textContent.trim(),n=parseFloat(t);if(Number.isNaN(n)||!/^\d+$/.test(t))return;const st=performance.now();
  const tick=x=>{const k=Math.min(1,(x-st)/850);el.textContent=Math.round(n*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(tick);else el.textContent=t};requestAnimationFrame(tick)})}
function animateMain(){
  if(reduceMotion)return;const m=$("#app");m.classList.remove("enter");
  [...m.children].forEach((el,i)=>el.style.setProperty("--i",i));
  m.querySelectorAll(".stat,.card,.day,.line").forEach((el,i)=>el.style.setProperty("--j",Math.min(i,14)));
  void m.offsetWidth;m.classList.add("enter");clearTimeout(enterTimer);enterTimer=setTimeout(()=>m.classList.remove("enter"),1900);countUp(m);
}

// ---------- availability logic ----------
function status(p,ev){
  const r=(ev.responses||{})[p.id],dow=new Date(ev.date+"T00:00").getDay();
  const c=(p.classes||[]).find(c=>c.days.includes(dow)&&t2m(c.start)<t2m(ev.end)&&t2m(ev.start)<t2m(c.end));
  if(r==="no")return{s:"no",why:"Marked not available"};
  if(r==="yes")return{s:"yes",why:c?"Confirmed, even with class: "+c.subject:"Confirmed available"};
  return c?{s:"busy",why:"Class: "+c.subject+" ("+t12(c.start)+"–"+t12(c.end)+")"}:{s:"free",why:"No class conflict"};
}
const byName=(a,b)=>(a.name||"").localeCompare(b.name||"");

// ---------- data ----------
db.collection("people").onSnapshot(s=>{people=s.docs.map(d=>({id:d.id,...d.data()})).sort(byName);render()},fail);
db.collection("events").onSnapshot(s=>{events=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.date+a.start).localeCompare(b.date+b.start));render()},fail);
let viewer=localStorage.getItem("viewer")==="1",lt="trainee",lmode="in",lmsg="",loginDrawn=false,wasIn=false,tryingLogin=false;
auth.onAuthStateChanged(async u=>{
  user=u;role=null;profile=null;
  if(u){
    let d=null;
    try{const x=await db.collection("users").doc(u.uid).get();d=x.exists?x.data():null}catch(e){fail(e)}
    if(d&&(d.role==="master"||d.role==="senior")){role=d.role;profile=d}
    else if(tryingLogin){tryingLogin=false;lt="staff";lmsg=d?"This is a trainee account. Choose Trainee and continue, no login needed.":"No grading sheet account found for this email. Create one in the grading sheet first.";loginDrawn=false}
  }
  render();
});
const nice=x=>({"auth/invalid-credential":"Wrong email or password.","auth/email-already-in-use":"That email already has an account. Sign in instead.","auth/weak-password":"Password needs at least 6 characters.","auth/too-many-requests":"Too many tries. Wait a bit and try again."})[x.code]||x.message;
function renderLogin(){
  $("#ltitle").textContent=lt==="trainee"?"Welcome, trainee":"Sign in";
  $("#lseg").dataset.active=lt;
  document.querySelectorAll("#lseg button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.g===lt)));
  $("#lbody").innerHTML=(lt==="trainee"?`<p class="sub">No login needed.</p><button class="gold wide" onclick="enterViewer()">Continue</button>`:
  `<form onsubmit="staffAuth(event)"><label>Email<input name="email" type="email" placeholder="you@example.com" required autocomplete="email"></label><label>Password<input name="password" type="password" minlength="6" placeholder="At least 6 characters" required autocomplete="current-password"></label><button class="gold wide">Sign in</button></form>
  <div class="row between"><span></span><a href="#" onclick="resetPw();return false">Forgot password?</a></div><p class="hint">Use your grading sheet account. Only Masters of Initiation and Senior Members can sign in.</p>`)+`<p class="err" id="lm" role="alert">${esc(lmsg)}</p>`;
  loginDrawn=true;
}
let swapBusy=false;
async function swapLogin(change){
  if(reduceMotion)return change();if(swapBusy)return;swapBusy=true;
  const c=$("#lcard");c.classList.add("swap-out");await wait(170);morph(c,change);await wait(30);c.classList.remove("swap-out");await wait(400);swapBusy=false;
}
document.querySelectorAll("#lseg button").forEach(b=>b.onclick=()=>{if(b.dataset.g!==lt)swapLogin(()=>{lt=b.dataset.g;lmsg="";renderLogin()})});
function staffAuth(e){e.preventDefault();tryingLogin=true;const d=Object.fromEntries(new FormData(e.target));$("#lm").textContent="";
  auth.signInWithEmailAndPassword(d.email,d.password).catch(x=>{tryingLogin=false;$("#lm").textContent=nice(x)})}
function resetPw(){const em=$("#lcard [name=email]").value.trim();if(!em)return $("#lm").textContent="Type your email first.";
  auth.sendPasswordResetEmail(em).then(()=>$("#lm").textContent="Reset link sent. Check your email.").catch(x=>$("#lm").textContent=nice(x))}
function enterViewer(){viewer=true;localStorage.setItem("viewer","1");render()}
function leave(){viewer=false;localStorage.removeItem("viewer");lt=role?"staff":"trainee";role?auth.signOut():render()}

// ---------- render ----------
let navBusy=false;
async function go(k){
  if(k===tab||navBusy)return;
  if(reduceMotion){tab=k;return render()}
  navBusy=true;const a=$("#app");a.classList.add("leaving");await wait(190);
  tab=k;render();a.classList.remove("leaving");animateMain();navBusy=false;
}
function render(){
  const inApp=!!role||viewer;$("#login").hidden=inApp;$("#shell").hidden=!inApp;
  if(!inApp){wasIn=false;if(!loginDrawn)renderLogin();return}
  loginDrawn=false;
  const T=role?[["events","Events"],["cal","Calendar"],["people","People"],["finder","Who’s free"]]:[["events","Events"],["cal","Calendar"],["mine","My schedule"],["finder","Who’s free"]];
  if(!T.some(t=>t[0]===tab))tab="events";
  $("#who").innerHTML=role?`<div class="who"><b>${esc(profile.name||user.email)}</b><small>${ROLE_AUTH[role]}</small></div><button onclick="leave()">Sign out</button>`:`<div class="who"><b>Trainee view</b><small>No login needed</small></div><button onclick="leave()">MI / Senior Members Login</button>`;

// ---------- weekly calendar + schedule pictures ----------
let calPid="",calWeek=0,calA=420,picCache={};
const COLORS=["#6ea8ff","#7fd9a1","#ff8fb1","#f0c53f","#b794f6","#5fd3d3","#ffa56e","#9fd356"];
const hue=t=>{let h=0;for(const c of t)h=(h*31+c.charCodeAt(0))>>>0;return COLORS[h%COLORS.length]};
const mondayOf=o=>{const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7)+o*7);return d};
const hm=m=>String(Math.floor(m/60)).padStart(2,"0")+":00";
function calView(){
  const pid=calPid||me,p=people.find(x=>x.id===pid),cls=p?p.classes||[]:[];
  const mon=mondayOf(calWeek),days=[...Array(7)].map((_,i)=>{const d=new Date(mon);d.setDate(mon.getDate()+i);return d});
  const ds=days.map(iso),today=iso(new Date()),evs=events.filter(e=>ds.includes(e.date));
  let a=420,b=1260;
  cls.forEach(c=>{a=Math.min(a,Math.floor(t2m(c.start)/60)*60);b=Math.max(b,Math.ceil(t2m(c.end)/60)*60)});
  evs.forEach(e=>{a=Math.min(a,Math.floor(t2m(e.start)/60)*60);b=Math.max(b,Math.ceil(t2m(e.end)/60)*60)});
  calA=a;const H=b-a,now=new Date(),nm=now.getHours()*60+now.getMinutes();
  const times=[];for(let m=a;m<=b;m+=60)times.push(`<span style="top:${m-a}px">${t12(hm(m))}</span>`);
  const cols=days.map((d,i)=>{
    const dow=d.getDay(),s=ds[i];
    const cb=cls.filter(c=>c.days.includes(dow)).map(c=>`<div class="blk" style="top:${t2m(c.start)-a}px;height:${t2m(c.end)-t2m(c.start)}px;--c:${hue(c.subject)}"><b>${esc(c.subject)}</b>${t12(c.start)}–${t12(c.end)}${c.room?"<br>"+esc(c.room):""}</div>`).join("");
    const eb=evs.filter(e=>e.date===s).map(e=>{const clash=cls.some(c=>c.days.includes(dow)&&t2m(c.start)<t2m(e.end)&&t2m(e.start)<t2m(c.end));
      return `<div class="blk ev ${clash?"clash":""}" style="top:${t2m(e.start)-a}px;height:${t2m(e.end)-t2m(e.start)}px" title="${clash?"Conflicts with a class":""}"><b>${esc(e.title)}</b>${t12(e.start)}–${t12(e.end)}${clash?"<br>Class conflict":""}</div>`}).join("");
    const nl=s===today&&nm>=a&&nm<=b?`<div class="now" id="nowline" style="top:${nm-a}px"></div>`:"";
    return `<div class="col ${s===today?"today":""}" style="height:${H}px">${cb}${eb}${nl}</div>`;
  }).join("");
  const heads=days.map((d,i)=>`<div class="h ${ds[i]===today?"today":""}">${DAYS[d.getDay()]}<small>${d.toLocaleDateString("en-PH",{month:"short",day:"numeric"})}</small></div>`).join("");
  const rng=days[0].toLocaleDateString("en-PH",{month:"short",day:"numeric"})+" – "+days[6].toLocaleDateString("en-PH",{month:"short",day:"numeric",year:"numeric"});
  return `<div class="row"><h2>Weekly calendar</h2><span class="live">Live</span><span class="sp"></span>
    <select onchange="calPid=this.value;render()" aria-label="Whose schedule"><option value="">— choose a name —</option>${people.map(x=>`<option value="${x.id}" ${x.id===pid?"selected":""}>${esc(x.name)}</option>`).join("")}</select></div>
  <div class="row"><button onclick="calWeek--;render()">‹ Prev</button><button onclick="calWeek=0;render()">This week</button><button onclick="calWeek++;render()">Next ›</button><b>${rng}</b></div>
  ${p?`<p class="hint">${esc(p.name)}${p.course?" · "+esc(p.course):""}. Gold blocks are choir events; a red outline means it clashes with a class.</p>`:`<p class="hint">Choose a name to see class schedule. Choir events show for everyone.</p>`}
  <div class="calwrap"><div class="cal">${heads.replace(/^/,'<div class="h"></div>')}<div class="tm" style="height:${H}px">${times.join("")}</div>${cols}</div></div>
  ${p?uploadRow(p.id)+(role?picsSection(p.id):""):""}`;
}
setInterval(()=>{const n=$("#nowline");if(n){const d=new Date();n.style.top=(d.getHours()*60+d.getMinutes()-calA)+"px"}},30000);

const uploadRow=pid=>`<div class="row"><label class="up"><input id="picfile" type="file" accept="image/*" multiple hidden onchange="uploadPics(this.files,'${pid}')"><span class="bt">Upload schedule picture</span></label><small>Only Masters of Initiation and Senior Members can view uploaded pictures.</small></div>`;
function compress(file){return new Promise((res,rej)=>{
  const img=new Image(),u=URL.createObjectURL(file);
  img.onerror=()=>rej(new Error("Could not read "+file.name));
  img.onload=()=>{URL.revokeObjectURL(u);let k=Math.min(1,1600/Math.max(img.width,img.height)),q=.8,d;
    for(let i=0;i<8;i++){const c=document.createElement("canvas");c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext("2d").drawImage(img,0,0,c.width,c.height);d=c.toDataURL("image/jpeg",q);if(d.length<800000)return res(d);q=Math.max(.5,q-.1);k*=.8}
    rej(new Error("Picture is too large. Try a smaller one."))};
  img.src=u})}
async function uploadPics(files,pid){
  const p=people.find(x=>x.id===pid);if(!p)return toast("Choose your name first");let n=0;
  for(const f of files){
    if(!f.type.startsWith("image/")){toast(f.name+" is not a picture");continue}
    try{toast("Uploading "+f.name+"…");const data=await compress(f);
      await db.collection("schedulePics").add({personId:p.id,personName:p.name,name:f.name.slice(0,80),data,createdAt:Date.now()});n++}catch(e){fail(e)}
  }
  if(n)toast(n+" picture"+(n>1?"s":"")+" uploaded");
  const i=$("#picfile");if(i)i.value="";
}
const picsSection=pid=>`<div class="card"><div class="row"><b>Uploaded schedule pictures</b><span class="sp"></span><button onclick="loadPics('${pid}')">View pictures</button></div><div id="pics" class="thumbs"></div></div>`;
async function loadPics(pid){
  const el=$("#pics");el.innerHTML="<small>Loading…</small>";
  try{const s=await db.collection("schedulePics").where("personId","==",pid).get();
    const l=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>b.createdAt-a.createdAt);picCache={};l.forEach(x=>picCache[x.id]=x);
    el.innerHTML=l.length?l.map(x=>`<img class="thumb" src="${x.data}" alt="Schedule picture" onclick="viewPic('${x.id}')">`).join(""):"<small>No pictures uploaded yet.</small>"}
  catch(e){el.innerHTML="";fail(e)}
}
function viewPic(id){const x=picCache[id];
  openDlg(`<h3>${esc(x.personName)}</h3><img src="${x.data}" alt="Schedule picture" style="width:100%;border-radius:8px"><p class="hint">${new Date(x.createdAt).toLocaleString("en-PH")}</p><div class="row"><button onclick="delPic('${id}','${x.personId}')">Delete</button><span class="sp"></span><button class="pri" onclick="closeDlg()">Close</button></div>`);
  $("#dlg").style.width="min(900px,94vw)"}
async function delPic(id,pid){if(!confirm("Delete this picture?"))return;try{await db.collection("schedulePics").doc(id).delete();closeDlg();loadPics(pid)}catch(e){fail(e)}}
