<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MSEUF Concert Singers Calendar</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#1a0408;--side:#230910;--s1:#2d0d14;--s2:#3b1620;--line:rgba(233,216,166,.15);--line2:rgba(233,216,166,.3);--ink:#f6ede1;--mut:#b8a39b;--gold:#e6c364;--gold2:#c79a2e;--ok:#8fd6a8;--bad:#ff8c7c;--warn:#ffc266;--serif:"Instrument Serif",Georgia,serif;--ease:cubic-bezier(.22,.8,.24,1)}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;min-height:100vh;font:15px/1.5 "Hanken Grotesk",system-ui,sans-serif;color:var(--ink);background:var(--bg)}
a{color:var(--gold)}h2{font:400 46px/1 var(--serif);margin:0}h3{font:400 26px/1.1 var(--serif);margin:0}h4{margin:12px 0 4px;font-size:13px;color:var(--gold)}
h3.sec{font-size:24px;color:var(--mut);margin:34px 0 2px}
small,.hint{color:var(--mut)}.sub{color:var(--mut);margin:6px 0 14px}.empty{color:var(--mut);padding:36px 0}.err{color:var(--bad);min-height:1.2em;margin:12px 0 0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:8px 0}.row>.sp,.sp{flex:1}.between{justify-content:space-between;font-size:14px}
button{font:inherit;font-weight:600;color:var(--ink);background:transparent;border:1px solid var(--line2);border-radius:999px;padding:7px 16px;cursor:pointer;transition:background .2s,color .2s,border-color .2s,transform .15s,box-shadow .2s}
button:hover{border-color:var(--gold);color:var(--gold)}
button.pri,button.gold{background:var(--gold);color:#2a0a10;border-color:var(--gold);padding:10px 22px}
button.pri:hover,button.gold:hover{background:#f0d27a;color:#2a0a10;box-shadow:0 6px 24px rgba(230,195,100,.25);transform:translateY(-1px)}
button.wide{width:100%;padding:13px;margin-top:8px}button.link{border:0;padding:0;text-align:left}
input,select,textarea{font:inherit;color:var(--ink);background:#150307;border:1px solid var(--line2);border-radius:10px;padding:9px 12px;max-width:100%}
input::placeholder{color:#8a746e}input[type=checkbox]{accent-color:var(--gold)}input[type=date],input[type=time]{color-scheme:dark}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
label{display:block;margin:8px 0;font-size:13px;color:var(--mut)}.row label{display:inline-flex;gap:6px;align-items:center;margin:0}
/* login */
#login{height:100vh;height:100dvh;display:grid;grid-template-columns:1fr 1fr}
.hero{position:relative;height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:clamp(14px,3vh,28px);padding:clamp(24px,4vw,56px);overflow:hidden;background:linear-gradient(160deg,#8f2638 0%,#4a0f1b 55%,#1a0408 100%)}

.hero h1{font:400 clamp(34px,min(5vw,7vh),68px)/1.05 var(--serif);margin:0;max-width:11ch}.hero .lines,.hero p{display:none}
.lr{display:grid;place-items:center;padding:24px;height:100%;overflow:auto}.lcard{width:min(400px,100%)}.lcard h2{font-size:42px}
.seg{position:relative;display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--line);margin:18px 0 22px}

.lcard input:not([type=checkbox]){width:100%;display:block;margin-top:4px}

#shell{display:grid;grid-template-columns:252px 1fr;min-height:100vh}

nav button{position:relative;display:flex;gap:12px;align-items:center;border:0;border-radius:12px;padding:11px 12px;color:var(--mut);text-align:left}
nav button svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
nav button:hover{color:var(--ink);background:rgba(255,255,255,.04)}
nav button.on{color:var(--ink);background:var(--s2)}nav button.on svg{color:var(--gold)}

#who{display:flex;gap:10px;align-items:center;justify-content:space-between;padding-top:16px;border-top:1px solid var(--line);font-size:13px}.who{min-width:0;flex:1}.who b{display:block;line-height:1.2}#who button{flex:none;white-space:nowrap;padding:7px 14px}
main{width:100%;min-width:0;max-width:1400px;margin:0 auto;padding:clamp(20px,3.5vh,40px) clamp(18px,3vw,48px) 80px}
.pagehead{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:26px}

.ev{display:grid;grid-template-columns:76px 1fr;gap:18px;padding:20px 2px;border-top:1px solid var(--line)}
.ev .dt{text-align:center}.ev .dt b{display:block;font:400 44px/1 var(--serif);color:var(--gold)}.ev .dt span{font-size:13px;color:var(--mut)}
.ev .meta{margin:2px 0 0;color:var(--mut)}.ev p{margin:6px 0}
.ev.big{grid-template-columns:130px 1fr;padding:30px;border:1px solid var(--line2);border-radius:24px;background:linear-gradient(135deg,#63172a 0%,#2d0d14 70%)}

.rel{color:var(--gold);font-size:13px;font-weight:600}

.cnt{display:flex;gap:16px;align-items:baseline;font-size:13px}
.tag{border:1px solid var(--gold2);color:var(--gold);border-radius:999px;padding:1px 10px;font-size:12px;font-weight:600}
.ok,.s-yes,.s-free{color:var(--ok);font-weight:600}.bad,.s-no{color:var(--bad);font-weight:600}.s-busy{color:var(--warn);font-weight:600}
.me{background:rgba(0,0,0,.28);border-radius:14px;padding:12px 14px;margin:12px 0}
details summary{cursor:pointer;color:var(--gold);font-weight:600}
.card,.day,.line{background:var(--s1);border:1px solid var(--line);border-radius:14px}.card{padding:14px 18px;margin:12px 0}
.day{padding:10px 16px;margin:10px 0}.cls{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;padding:6px 0;border-top:1px dashed var(--line)}.cls span:last-child{margin-left:auto}
.line{padding:8px 14px}.line.sel{border-color:var(--gold)}.line>.link{min-width:220px}
dialog{background:var(--s1);color:var(--ink);border:1px solid var(--line2);border-radius:20px;padding:22px;width:min(440px,94vw)}dialog::backdrop{background:#000b}
dialog input:not([type=checkbox]),dialog select,dialog textarea{width:100%;display:block;margin-top:4px}
.days label{display:inline-flex;gap:4px;align-items:center;margin-right:8px;color:var(--ink)}
#toast{position:fixed;bottom:18px;left:50%;transform:translate(-50%,90px);background:var(--gold);color:#2a0a10;font-weight:600;padding:10px 20px;border-radius:999px;transition:.2s;max-width:90vw;z-index:9}#toast.show{transform:translate(-50%,0)}
/* weekly calendar */
.calwrap{overflow-x:auto;border:1px solid var(--line);border-radius:16px;background:var(--s1)}
.cal{display:grid;grid-template-columns:60px repeat(7,minmax(96px,1fr));min-width:780px}
.cal .h{background:var(--s2);padding:9px 4px;text-align:center;font-weight:700;font-size:13px;border-bottom:1px solid var(--line)}
.cal .h small{display:block;font-weight:500;color:inherit;opacity:.75}.cal .h.today{color:#2a0a10;background:var(--gold)}
.cal .tm{position:relative;border-right:1px solid var(--line)}.cal .tm span{position:absolute;right:6px;transform:translateY(-50%);font-size:11px;color:var(--mut)}
.cal .col{position:relative;border-left:1px solid var(--line);background-image:repeating-linear-gradient(to bottom,var(--line) 0 1px,transparent 1px 60px)}
.cal .col.today{background-color:rgba(230,195,100,.06)}
.blk{position:absolute;left:3px;right:3px;z-index:1;border-radius:8px;border-left:3px solid var(--c);background:color-mix(in srgb,var(--c) 24%,#2d0d14);padding:3px 7px;font-size:11px;line-height:1.25;overflow:hidden}
.blk b{display:block;font-size:12px}
.blk.ev{left:36%;z-index:3;display:block;border:0;background:var(--gold);color:#2a0a10;box-shadow:0 2px 8px #0008}.blk.ev.clash{outline:2px solid var(--bad)}
.now{position:absolute;left:0;right:0;height:2px;background:var(--bad);z-index:4}.now::before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--bad)}
.live{display:inline-flex;gap:6px;align-items:center;font-size:12px;color:var(--ok)}.live::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ok);animation:pulse 1.6s infinite}
@keyframes glow{0%,100%{box-shadow:0 0 0 8px rgba(199,154,46,.12),0 0 40px rgba(230,195,100,.15)}50%{box-shadow:0 0 0 20px rgba(199,154,46,.2),0 0 90px rgba(230,195,100,.45)}}
@keyframes glowS{0%,100%{box-shadow:0 0 0 0 rgba(230,195,100,0)}50%{box-shadow:0 0 14px 3px rgba(230,195,100,.5)}}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.up .bt{display:inline-block;border-radius:999px;padding:10px 22px;background:var(--gold);color:#2a0a10;font-weight:600;cursor:pointer}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.thumb{height:110px;border-radius:10px;border:1px solid var(--line2);cursor:pointer}
/* motion */
@keyframes rise{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes slidein{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.97)}to{opacity:1;transform:none}}
.lcard>*{transition:opacity .3s,transform .4s var(--ease)}.lcard.swap-out>*:not(.seg){opacity:0;transform:translateY(8px);transition-duration:.17s}
.lcard{animation:rise .7s .15s var(--ease) both}#lbody>*{animation:fade .35s ease both}
#login:not([hidden]) .hero>*{animation:rise .8s var(--ease) both}.hero>:nth-child(2){animation-delay:.12s!important}
#login:not([hidden]) .hero>img{animation:rise .8s var(--ease) both,glow 4.5s ease-in-out 1s infinite,breathe 4.5s ease-in-out 1s infinite}
.logo{animation:glowS 4s ease-in-out infinite}
#shell:not([hidden]){animation:fade .6s ease both}#shell:not([hidden]) #side{animation:slidein .6s var(--ease) both}
#app.leaving{opacity:0;transform:translateY(-12px);transition:opacity .19s ease,transform .19s ease}
#app.enter>*{animation:rise .75s var(--ease) both;animation-delay:calc(var(--i,0)*80ms)}
#app.enter .ev,#app.enter .card,#app.enter .day,#app.enter .line{animation:rise .6s var(--ease) both;animation-delay:calc(160ms + var(--j,0)*80ms)}
dialog[open]{animation:pop .4s var(--ease) both}dialog[open]::backdrop{animation:fade .2s ease both}
@media(max-width:860px){
  #login{grid-template-columns:1fr;height:auto;min-height:100dvh}.hero{height:auto;padding:28px}.lr{height:auto}.hero img{width:96px;height:96px}.hero h1{font-size:38px}
  #shell{grid-template-columns:1fr}#side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:14px 16px;gap:12px}
  .brand span{display:none}nav{flex-direction:row;overflow-x:auto;width:100%;order:3}nav button.on::before{display:none}
  #bar{margin:0;width:100%;order:4}#who{border:0;padding:0;margin-left:auto}.who{display:none}
  .ev,.ev.big{grid-template-columns:1fr;gap:8px}.ev .dt{text-align:left;display:flex;gap:8px;align-items:baseline}.ev.big .dt b{font-size:56px}.ev.big{padding:20px}.ev.big h3{font-size:32px}
}
@media(prefers-reduced-motion:reduce){*,*::before{animation:none!important;transition:none!important}}
</style></head><body>
<div id="login" hidden><section class="hero"><img src="logo.jpg" alt="MSEUF Concert Singers logo"><h1>MSEUF Concert Singers Calendar</h1><div class="lines"></div></section><section class="lr"><div class="lcard" id="lcard"><h2 id="ltitle"></h2><div class="seg" id="lseg" data-active="trainee"><button type="button" data-g="trainee">Trainee</button><button type="button" data-g="staff">Master / Senior Member</button></div><div id="lbody"></div></div></section></div>
<div id="shell" hidden><aside id="side"><div class="brand"><img class="logo" src="logo.jpg" alt="" onerror="this.remove()"><div><b>MSEUF</b><span>Concert Singers Calendar</span></div></div><nav id="tabs"></nav><div id="bar"></div><div id="who"></div></aside><main id="app"></main></div><dialog id="dlg"></dialog><div id="toast" role="status"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
// ====== 1. PASTE YOUR FIREBASE CONFIG (Project settings → Your apps → Web app) ======
const firebaseConfig={apiKey:"AIzaSyAVmZRNPRF5vozc9q3vSwNQjOSDRYtLuxI",authDomain:"mseuf-grading-sheet.firebaseapp.com",projectId:"mseuf-grading-sheet",storageBucket:"mseuf-grading-sheet.firebasestorage.app",messagingSenderId:"548651789448",appId:"1:548651789448:web:94af671a75e00dff14033d"};

firebase.initializeApp(firebaseConfig);
const db=firebase.firestore(),auth=firebase.auth();
const DAYS=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"],CODE={M:1,T:2,W:3,Th:4,F:5,S:6};
const ROLES={trainee:"Trainee",member:"Member",senior:"Senior member",mi:"Master of Initiation"};
const ROLE_AUTH={master:"Master of Initiation",senior:"Senior Member"};
const LBL={yes:"Available (confirmed)",free:"Available",busy:"Class conflict",no:"Not available"};
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const t2m=t=>{const[h,m]=t.split(":");return +h*60+ +m};
const t12=t=>{let[h,m]=t.split(":");h=+h;return(h%12||12)+":"+m+(h<12?" AM":" PM")};
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const dstr=s=>new Date(s+"T00:00").toLocaleDateString("en-PH",{weekday:"short",month:"short",day:"numeric",year:"numeric"});
const opts=(o,sel)=>Object.entries(o).map(([k,v])=>`<option value="${k}" ${k===sel?"selected":""}>${v}</option>`).join("");
const fld=(l,n,v,t="text",r)=>`<label>${l}<input name="${n}" type="${t}" value="${esc(v)}" ${r?"required":""}></label>`;
const parseDays=s=>[...s.matchAll(/Th|M|T|W|F|S/g)].map(m=>CODE[m[0]]);

let people=[],events=[],role=null,user=null,profile=null,tab="events",me=localStorage.getItem("me")||"",viewPid="",showPast=false;
const tmr=new Date();tmr.setDate(tmr.getDate()+1);
let f={date:iso(tmr),start:"16:00",end:"18:00",aud:"trainee"};

function toast(m){const t=$("#toast");t.textContent=m;t.className="show";clearTimeout(toast.t);toast.t=setTimeout(()=>t.className="",3500)}
const openDlg=h=>{$("#dlg").style.width="";$("#dlg").innerHTML=h;$("#dlg").showModal()},closeDlg=()=>$("#dlg").close();
const fail=e=>toast(e.message||String(e));
const reduceMotion=matchMedia("(prefers-reduced-motion: reduce)").matches,wait=ms=>new Promise(r=>setTimeout(r,ms));
function morph(el,change){
  if(reduceMotion)return change();
  const h0=el.offsetHeight;change();const h1=el.offsetHeight;if(Math.abs(h0-h1)<2)return;
  el.style.height=h0+"px";el.style.overflow="hidden";el.getBoundingClientRect();
  el.style.transition="height .5s cubic-bezier(.22,.8,.24,1)";el.style.height=h1+"px";
  setTimeout(()=>{el.style.height=el.style.overflow=el.style.transition=""},560);
}
let enterTimer;
function countUp(m){m.querySelectorAll(".stat b").forEach(el=>{const t=el.textContent.trim(),n=parseFloat(t);if(Number.isNaN(n)||!/^\d+$/.test(t))return;const st=performance.now();
  const tick=x=>{const k=Math.min(1,(x-st)/850);el.textContent=Math.round(n*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(tick);else el.textContent=t};requestAnimationFrame(tick)})}
function animateMain(){
  if(reduceMotion)return;const m=$("#app");m.classList.remove("enter");
  [...m.children].forEach((el,i)=>el.style.setProperty("--i",i));
  m.querySelectorAll(".ev,.card,.day,.line").forEach((el,i)=>el.style.setProperty("--j",Math.min(i,14)));
  void m.offsetWidth;m.classList.add("enter");clearTimeout(enterTimer);enterTimer=setTimeout(()=>m.classList.remove("enter"),1900);countUp(m);
}

// ---------- availability logic ----------
function status(p,ev){
  const r=(ev.responses||{})[p.id],dow=new Date(ev.date+"T00:00").getDay();
  const c=(p.classes||[]).find(c=>c.days.includes(dow)&&t2m(c.start)<t2m(ev.end)&&t2m(ev.start)<t2m(c.end));
  if(r==="no")return{s:"no",why:"Marked not available"};
  if(r==="yes")return{s:"yes",why:c?"Confirmed, even with class: "+c.subject:"Confirmed available"};
  return c?{s:"busy",why:"Class: "+c.subject+" ("+t12(c.start)+"–"+t12(c.end)+")"}:{s:"free",why:"No class conflict"};
}
const byName=(a,b)=>(a.name||"").localeCompare(b.name||"");

// ---------- data ----------
db.collection("people").onSnapshot(s=>{people=s.docs.map(d=>({id:d.id,...d.data()})).sort(byName);render()},fail);
db.collection("events").onSnapshot(s=>{events=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.date+a.start).localeCompare(b.date+b.start));render()},fail);
let viewer=localStorage.getItem("viewer")==="1",lt="trainee",lmode="in",lmsg="",loginDrawn=false,wasIn=false,tryingLogin=false;
auth.onAuthStateChanged(async u=>{
  user=u;role=null;profile=null;
  if(u){
    let d=null;
    try{const x=await db.collection("users").doc(u.uid).get();d=x.exists?x.data():null}catch(e){fail(e)}
    if(d&&(d.role==="master"||d.role==="senior")){role=d.role;profile=d}
    else if(tryingLogin){tryingLogin=false;lt="staff";lmsg=d?"This is a trainee account. Choose Trainee and continue, no login needed.":"No grading sheet account found for this email. Create one in the grading sheet first.";loginDrawn=false}
  }
  render();
});
const nice=x=>({"auth/invalid-credential":"Wrong email or password.","auth/email-already-in-use":"That email already has an account. Sign in instead.","auth/weak-password":"Password needs at least 6 characters.","auth/too-many-requests":"Too many tries. Wait a bit and try again."})[x.code]||x.message;
function renderLogin(){
  $("#ltitle").textContent=lt==="trainee"?"Welcome, trainee":"Sign in";
  $("#lseg").dataset.active=lt;
  document.querySelectorAll("#lseg button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.g===lt)));
  $("#lbody").innerHTML=(lt==="trainee"?`<p class="sub">No login needed.</p><button class="gold wide" onclick="enterViewer()">Continue</button>`:
  `<form onsubmit="staffAuth(event)"><label>Email<input name="email" type="email" placeholder="you@example.com" required autocomplete="email"></label><label>Password<input name="password" type="password" minlength="6" placeholder="At least 6 characters" required autocomplete="current-password"></label><button class="gold wide">Sign in</button></form>
  <div class="row between"><span></span><a href="#" onclick="resetPw();return false">Forgot password?</a></div><p class="hint">Use your grading sheet account. Only Masters of Initiation and Senior Members can sign in.</p>`)+`<p class="err" id="lm" role="alert">${esc(lmsg)}</p>`;
  loginDrawn=true;
}
let swapBusy=false;
async function swapLogin(change){
  if(reduceMotion)return change();if(swapBusy)return;swapBusy=true;
  const c=$("#lcard");c.classList.add("swap-out");await wait(170);morph(c,change);await wait(30);c.classList.remove("swap-out");await wait(400);swapBusy=false;
}
document.querySelectorAll("#lseg button").forEach(b=>b.onclick=()=>{if(b.dataset.g!==lt)swapLogin(()=>{lt=b.dataset.g;lmsg="";renderLogin()})});

let navBusy=false;
async function go(k){
  if(k===tab||navBusy)return;
  if(reduceMotion){tab=k;return render()}
  navBusy=true;const a=$("#app");a.classList.add("leaving");await wait(190);
  tab=k;render();a.classList.remove("leaving");animateMain();navBusy=false;
}
function render(){
  const inApp=!!role||viewer;$("#login").hidden=inApp;$("#shell").hidden=!inApp;
  if(!inApp){wasIn=false;if(!loginDrawn)renderLogin();return}
  loginDrawn=false;
  const T=role?[["events","Events"],["cal","Calendar"],["people","People"],["finder","Who’s free"]]:[["events","Events"],["cal","Calendar"],["mine","My schedule"],["finder","Who’s free"]];
  if(!T.some(t=>t[0]===tab))tab="events";
  $("#who").innerHTML=role?`<div class="who"><b>${esc(profile.name||user.email)}</b><small>${ROLE_AUTH[role]}</small></div><button onclick="leave()">Sign out</button>`:`<div class="who"><b>Trainee view</b><small>No login needed</small></div><button onclick="leave()">MI / Senior Members Login</button>`;
  $("#tabs").innerHTML=T.map(([k,l])=>`<button class="${k===tab?"on":""}" onclick="go('${k}')"><svg viewBox="0 0 24 24" aria-hidden="true">${ICON[k]}</svg>${l}</button>`).join("");
  $("#bar").innerHTML=`<label>I am: <select onchange="setMe(this.value)"><option value="">— choose your name —</option>${people.map(p=>`<option value="${p.id}" ${p.id===me?"selected":""}>${esc(p.name)}</option>`).join("")}</select></label><button onclick="addPerson()">I’m not listed</button>`;
  $("#app").innerHTML=({events:evView,cal:calView,mine:()=>schedView(me),people:peopleView,finder:finderView})[tab]();
  if(tab==="finder")finderRes();
  if(!wasIn){wasIn=true;animateMain()}
}

// ---------- events ----------
function lst(t,a){return a.length?`<h4>${t} (${a.length})</h4><ul>${a.map(x=>`<li>${esc(x.p.name)} <small>— ${esc(x.why)}</small></li>`).join("")}</ul>`:""}
function evBlock(ev,mp,big){
  const d=new Date(ev.date+"T00:00"),n=Math.round((d-new Date(iso(new Date())+"T00:00"))/864e5);
  const rel=n===0?"Today":n===1?"Tomorrow":n>1?"In "+n+" days":-n+(n===-1?" day ago":" days ago");
  const st=people.filter(p=>ev.audience==="all"||p.role==="trainee").map(p=>({p,...status(p,ev)}));
  const ins=st.filter(x=>x.s==="yes"||x.s==="free"),outs=st.filter(x=>x.s==="no"||x.s==="busy"),mine=mp&&status(mp,ev);
  return `<article class="ev ${big?"big":""}"><div class="dt"><b>${d.getDate()}</b><span>${d.toLocaleDateString("en-PH",{month:"short"})}</span></div><div>
    <div class="row"><h3>${esc(ev.title)}</h3><span class="tag">${esc(ev.type)}</span><span class="rel">${rel}</span><span class="sp"></span>${role?`<button onclick="evDlg('${ev.id}')">Edit</button><button onclick="delEv('${ev.id}')">Delete</button>`:""}</div>
    <p class="meta">${DAYS[d.getDay()]} · ${t12(ev.start)}–${t12(ev.end)}${ev.venue?" · "+esc(ev.venue):""}</p>
    ${ev.notes?`<p>${esc(ev.notes)}</p>`:""}
    <div class="meter" role="img" aria-label="${ins.length} available, ${outs.length} not available"><i class="in" style="flex:${ins.length}"></i><i class="out" style="flex:${outs.length}"></i></div>
    <p class="cnt"><span class="ok">${ins.length} available</span><span class="bad">${outs.length} not available</span><small>${ev.audience==="all"?"everyone":"trainees"}</small></p>
    ${mp?`<div class="me">${esc(mp.name)}: <span class="s-${mine.s}">${LBL[mine.s]}</span> <small>${esc(mine.why)}</small><div class="row"><button onclick="resp('${ev.id}','yes')">I’m available</button><button onclick="resp('${ev.id}','no')">Not available</button><button onclick="resp('${ev.id}',null)">Reset to auto</button></div></div>`:`<p class="hint">Choose your name to respond.</p>`}
    <details><summary>See who’s in</summary>${lst("Available",ins)}${lst("Not available",outs)}</details></div></article>`;
}
function evView(){
  const t=iso(new Date()),mp=people.find(p=>p.id===me),up=events.filter(e=>e.date>=t),past=events.filter(e=>e.date<t).reverse();
  return `<div class="pagehead"><h2>Events</h2><small>${up.length} upcoming</small><span class="sp"></span><label><input type="checkbox" ${showPast?"checked":""} onchange="showPast=this.checked;render()"> Show past</label>${role?`<button class="pri" onclick="evDlg()">New event</button>`:""}</div>`+
  (up.length?evBlock(up[0],mp,true)+(up.length>1?`<h3 class="sec">Coming up</h3>`+up.slice(1).map(e=>evBlock(e,mp)).join(""):""):`<p class="empty">No upcoming events yet.${role?" Use New event to add one.":""}</p>`)+
  (showPast&&past.length?`<h3 class="sec">Past</h3>`+past.map(e=>evBlock(e,mp)).join(""):"");
}
function resp(id,v){db.collection("events").doc(id).update({["responses."+me]:v==null?firebase.firestore.FieldValue.delete():v}).catch(fail)}
function evDlg(id){
  const e=events.find(x=>x.id===id)||{title:"",type:"rehearsal",date:iso(new Date()),start:"17:00",end:"19:00",venue:"",audience:"trainees",notes:""};
  openDlg(`<form onsubmit="saveEv(event,'${id||""}')"><h3>${id?"Edit":"New"} event</h3>${fld("Title","title",e.title,"text",1)}

  ${fld("Date","date",e.date,"date",1)}${fld("Start","start",e.start,"time",1)}${fld("End","end",e.end,"time",1)}${fld("Venue","venue",e.venue)}
  <label>Needs<select name="audience">${opts({trainees:"Trainees only",all:"Everyone"},e.audience)}</select></label>

  const days=[1,2,3,4,5,6].map(d=>({d,l:(p.classes||[]).filter(c=>c.days.includes(d)).sort((a,b)=>t2m(a.start)-t2m(b.start))}));

function classDlg(pid,cid){

  openDlg(`<form onsubmit="saveClass(event,'${pid}','${cid||""}')"><h3>${cid?"Edit":"Add"} class</h3>${fld("Subject","subject",c.subject,"text",1)}
  <label>Days</label><div class="days">${[1,2,3,4,5,6].map(d=>`<label><input type="checkbox" name="d" value="${d}" ${c.days.includes(d)?"checked":""}>${DAYS[d]}</label>`).join("")}</div>

function saveClasses(pid,l){return db.collection("people").doc(pid).update({classes:l,updatedAt:Date.now()}).catch(fail)}
function saveClass(e,pid,cid){
  e.preventDefault();const fd=new FormData(e.target),p=people.find(x=>x.id===pid),days=fd.getAll("d").map(Number);
  if(!days.length)return toast("Pick at least one day");
  if(t2m(fd.get("end"))<=t2m(fd.get("start")))return toast("End time must be after start time");
  const c={id:cid||"c"+Date.now().toString(36),days,start:fd.get("start"),end:fd.get("end"),subject:fd.get("subject"),room:fd.get("room")};
  saveClasses(pid,(p.classes||[]).filter(x=>x.id!==cid).concat(c)).then(()=>{closeDlg();toast("Class saved")});

// ---------- weekly calendar + schedule pictures ----------
let calPid="",calWeek=0,calA=420,picCache={};
const COLORS=["#6ea8ff","#7fd9a1","#ff8fb1","#f0c53f","#b794f6","#5fd3d3","#ffa56e","#9fd356"];
const hue=t=>{let h=0;for(const c of t)h=(h*31+c.charCodeAt(0))>>>0;return COLORS[h%COLORS.length]};
const mondayOf=o=>{const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7)+o*7);return d};
const hm=m=>String(Math.floor(m/60)).padStart(2,"0")+":00";
function calView(){
  const pid=calPid||me,p=people.find(x=>x.id===pid),cls=p?p.classes||[]:[];
  const mon=mondayOf(calWeek),days=[...Array(7)].map((_,i)=>{const d=new Date(mon);d.setDate(mon.getDate()+i);return d});
  const ds=days.map(iso),today=iso(new Date()),evs=events.filter(e=>ds.includes(e.date));
  let a=420,b=1260;
  cls.forEach(c=>{a=Math.min(a,Math.floor(t2m(c.start)/60)*60);b=Math.max(b,Math.ceil(t2m(c.end)/60)*60)});
  evs.forEach(e=>{a=Math.min(a,Math.floor(t2m(e.start)/60)*60);b=Math.max(b,Math.ceil(t2m(e.end)/60)*60)});
  calA=a;const H=b-a,now=new Date(),nm=now.getHours()*60+now.getMinutes();
  const times=[];for(let m=a;m<=b;m+=60)times.push(`<span style="top:${m-a}px">${t12(hm(m))}</span>`);
  const cols=days.map((d,i)=>{
    const dow=d.getDay(),s=ds[i];
    const cb=cls.filter(c=>c.days.includes(dow)).map(c=>`<div class="blk" style="top:${t2m(c.start)-a}px;height:${t2m(c.end)-t2m(c.start)}px;--c:${hue(c.subject)}"><b>${esc(c.subject)}</b>${t12(c.start)}–${t12(c.end)}${c.room?"<br>"+esc(c.room):""}</div>`).join("");
    const eb=evs.filter(e=>e.date===s).map(e=>{const clash=cls.some(c=>c.days.includes(dow)&&t2m(c.start)<t2m(e.end)&&t2m(e.start)<t2m(c.end));
      return `<div class="blk ev ${clash?"clash":""}" style="top:${t2m(e.start)-a}px;height:${t2m(e.end)-t2m(e.start)}px" title="${clash?"Conflicts with a class":""}"><b>${esc(e.title)}</b>${t12(e.start)}–${t12(e.end)}${clash?"<br>Class conflict":""}</div>`}).join("");
    const nl=s===today&&nm>=a&&nm<=b?`<div class="now" id="nowline" style="top:${nm-a}px"></div>`:"";
    return `<div class="col ${s===today?"today":""}" style="height:${H}px">${cb}${eb}${nl}</div>`;
  }).join("");
  const heads=days.map((d,i)=>`<div class="h ${ds[i]===today?"today":""}">${DAYS[d.getDay()]}<small>${d.toLocaleDateString("en-PH",{month:"short",day:"numeric"})}</small></div>`).join("");
  const rng=days[0].toLocaleDateString("en-PH",{month:"short",day:"numeric"})+" – "+days[6].toLocaleDateString("en-PH",{month:"short",day:"numeric",year:"numeric"});
  return `<div class="row"><h2>Weekly calendar</h2><span class="live">Live</span><span class="sp"></span>
    <select onchange="calPid=this.value;render()" aria-label="Whose schedule"><option value="">— choose a name —</option>${people.map(x=>`<option value="${x.id}" ${x.id===pid?"selected":""}>${esc(x.name)}</option>`).join("")}</select></div>
  <div class="row"><button onclick="calWeek--;render()">‹ Prev</button><button onclick="calWeek=0;render()">This week</button><button onclick="calWeek++;render()">Next ›</button><b>${rng}</b></div>
  ${p?`<p class="hint">${esc(p.name)}${p.course?" · "+esc(p.course):""}. Gold blocks are choir events; a red outline means it clashes with a class.</p>`:`<p class="hint">Choose a name to see class schedule. Choir events show for everyone.</p>`}
  <div class="calwrap"><div class="cal">${heads.replace(/^/,'<div class="h"></div>')}<div class="tm" style="height:${H}px">${times.join("")}</div>${cols}</div></div>
  ${p?uploadRow(p.id)+(role?picsSection(p.id):""):""}`;
}
setInterval(()=>{const n=$("#nowline");if(n){const d=new Date();n.style.top=(d.getHours()*60+d.getMinutes()-calA)+"px"}},30000);

const uploadRow=pid=>`<div class="row"><label class="up"><input id="picfile" type="file" accept="image/*" multiple hidden onchange="uploadPics(this.files,'${pid}')"><span class="bt">Upload schedule picture</span></label><small>Only Masters of Initiation and Senior Members can view uploaded pictures.</small></div>`;
function compress(file){return new Promise((res,rej)=>{
  const img=new Image(),u=URL.createObjectURL(file);
  img.onerror=()=>rej(new Error("Could not read "+file.name));
  img.onload=()=>{URL.revokeObjectURL(u);let k=Math.min(1,1600/Math.max(img.width,img.height)),q=.8,d;
    for(let i=0;i<8;i++){const c=document.createElement("canvas");c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext("2d").drawImage(img,0,0,c.width,c.height);d=c.toDataURL("image/jpeg",q);if(d.length<800000)return res(d);q=Math.max(.5,q-.1);k*=.8}
    rej(new Error("Picture is too large. Try a smaller one."))};
  img.src=u})}
async function uploadPics(files,pid){
  const p=people.find(x=>x.id===pid);if(!p)return toast("Choose your name first");let n=0;
  for(const f of files){
    if(!f.type.startsWith("image/")){toast(f.name+" is not a picture");continue}
    try{toast("Uploading "+f.name+"…");const data=await compress(f);
      await db.collection("schedulePics").add({personId:p.id,personName:p.name,name:f.name.slice(0,80),data,createdAt:Date.now()});n++}catch(e){fail(e)}
  }
  if(n)toast(n+" picture"+(n>1?"s":"")+" uploaded");
  const i=$("#picfile");if(i)i.value="";
}
const picsSection=pid=>`<div class="card"><div class="row"><b>Uploaded schedule pictures</b><span class="sp"></span><button onclick="loadPics('${pid}')">View pictures</button></div><div id="pics" class="thumbs"></div></div>`;
async function loadPics(pid){
  const el=$("#pics");el.innerHTML="<small>Loading…</small>";
  try{const s=await db.collection("schedulePics").where("personId","==",pid).get();
    const l=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>b.createdAt-a.createdAt);picCache={};l.forEach(x=>picCache[x.id]=x);
    el.innerHTML=l.length?l.map(x=>`<img class="thumb" src="${x.data}" alt="Schedule picture" onclick="viewPic('${x.id}')">`).join(""):"<small>No pictures uploaded yet.</small>"}
  catch(e){el.innerHTML="";fail(e)}
}
function viewPic(id){const x=picCache[id];
  openDlg(`<h3>${esc(x.personName)}</h3><img src="${x.data}" alt="Schedule picture" style="width:100%;border-radius:8px"><p class="hint">${new Date(x.createdAt).toLocaleString("en-PH")}</p><div class="row"><button onclick="delPic('${id}','${x.personId}')">Delete</button><span class="sp"></span><button class="pri" onclick="closeDlg()">Close</button></div>`);
  $("#dlg").style.width="min(900px,94vw)"}
async function delPic(id,pid){if(!confirm("Delete this picture?"))return;try{await db.collection("schedulePics").doc(id).delete();closeDlg();loadPics(pid)}catch(e){fail(e)}}
