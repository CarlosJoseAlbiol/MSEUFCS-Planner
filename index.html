<style>
:root{--bg:#250305;--side:rgba(26,3,5,.9);--s1:rgba(43,5,7,.88);--s2:rgba(71,4,8,.85);--line:rgba(212,166,42,.3);--line2:rgba(238,197,82,.45);--ink:#f6ece8;--mut:#c4aaa3;--gold:#f0c53f;--gold2:#c99a1c;--ok:#7fd9a1;--bad:#ff8f86;--warn:#ffc266;--serif:"Cormorant Garamond",Georgia,serif;--ease:cubic-bezier(.22,.8,.24,1)}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;min-height:100vh;font:15px/1.5 Figtree,system-ui,sans-serif;color:var(--ink);background:radial-gradient(120% 90% at 20% 0%,#751019 0%,#4a0a10 40%,#250305 100%) fixed}
body::after{content:"";position:fixed;right:-120px;bottom:-60px;width:520px;height:520px;background:url(logo.jpg) center/cover;border-radius:50%;opacity:.15;mix-blend-mode:screen;pointer-events:none;animation:clefFloat 10s ease-in-out infinite}
@keyframes clefFloat{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-22px) rotate(1deg)}}
#login,#shell{position:relative;z-index:1}
a{color:var(--gold)}h2{font:600 48px/1.05 var(--serif);color:var(--gold);margin:0}h3{font:600 28px/1.1 var(--serif);color:var(--gold);margin:0}h4{margin:12px 0 4px;font-size:13px;color:var(--gold)}
h3.sec{font-size:24px;color:var(--mut);margin:34px 0 2px}
small,.hint{color:var(--mut)}.sub{color:var(--mut);margin:6px 0 14px}.empty{color:var(--mut);padding:36px 0}.err{color:var(--bad);min-height:1.2em;margin:12px 0 0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:8px 0}.row>.sp,.sp{flex:1}.between{justify-content:space-between;font-size:14px}
button{font:inherit;font-weight:600;color:var(--gold);background:transparent;border:1px solid var(--line2);border-radius:999px;padding:7px 16px;cursor:pointer;transition:background .2s,color .2s,border-color .2s,transform .15s,box-shadow .2s}
button:hover{border-color:var(--gold);color:var(--gold)}
button.pri,button.gold{background:linear-gradient(#f7da72,#d9a82a);color:#2a0305;border-color:#d9a82a;padding:10px 22px}
button.pri:hover,button.gold:hover{background:linear-gradient(#fbe590,#e5b83c);color:#2a0305;box-shadow:0 6px 22px rgba(219,150,0,.4);transform:translateY(-1px)}
button.wide{width:100%;padding:13px;margin-top:8px}button.link{border:0;padding:0;text-align:left}
input,select,textarea{font:inherit;color:var(--ink);background:#1c0305;border:1px solid var(--line2);border-radius:10px;padding:9px 12px;max-width:100%}
input::placeholder{color:#8a746e}input[type=checkbox]{accent-color:var(--gold)}input[type=date],input[type=time]{color-scheme:dark}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
label{display:block;margin:8px 0;font-size:13px;color:var(--mut)}.row label{display:inline-flex;gap:6px;align-items:center;margin:0}
/* login */
#login{height:100vh;height:100dvh;display:grid;grid-template-columns:1fr 1fr}
.hero{position:relative;height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:clamp(14px,3vh,28px);padding:clamp(24px,4vw,56px);overflow:hidden;border-right:1px solid var(--line)}
.hero img{width:clamp(130px,28vh,250px);height:clamp(130px,28vh,250px);border-radius:50%;object-fit:cover;border:2px solid var(--gold2)}
.hero h1{font:600 clamp(38px,min(5vw,7vh),72px)/1.02 var(--serif);color:var(--gold);margin:0;max-width:12ch}.hero .lines,.hero p{display:none}
.lr{display:grid;place-items:center;padding:24px;height:100%;overflow:auto}.lcard{width:min(400px,100%)}.lcard h2{font-size:46px}
.seg{position:relative;display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--line);margin:18px 0 22px}
.seg button{border:0;border-radius:0;background:none;padding:12px 4px;color:var(--mut)}.seg button[aria-pressed=true]{color:var(--ink)}
.seg::before{content:"";position:absolute;left:0;bottom:-1px;height:2px;width:50%;background:var(--gold);transition:transform .45s var(--ease)}
.seg[data-active=staff]::before{transform:translateX(100%)}
.lcard input:not([type=checkbox]){width:100%;display:block;margin-top:4px}
/* shell */
#shell{display:grid;grid-template-columns:252px 1fr;min-height:100vh}
#side{position:sticky;top:0;height:100vh;height:100dvh;overflow-y:auto;display:flex;flex-direction:column;gap:20px;padding:22px 16px;background:var(--side);border-right:1px solid var(--line)}
.brand{display:flex;gap:12px;align-items:center;padding:0 6px}.logo{width:48px;height:48px;border-radius:50%;object-fit:cover;border:1.5px solid var(--gold2);flex:none}
.brand b{display:block;font:700 26px/1 var(--serif);color:var(--gold)}.brand span{font-size:12px;color:var(--mut)}
nav{display:flex;flex-direction:column;gap:2px}
nav button{position:relative;display:flex;gap:12px;align-items:center;border:0;border-radius:12px;padding:11px 12px;color:var(--mut);text-align:left}
nav button svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
nav button:hover{color:var(--ink);background:rgba(255,255,255,.04)}
nav button.on{color:var(--ink);background:var(--s2)}nav button.on svg{color:var(--gold)}
nav button.on::before{content:"";position:absolute;left:-16px;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:var(--gold)}
#bar{margin-top:auto;display:grid;gap:8px;font-size:12px;color:var(--mut)}#bar label{display:grid;gap:4px;margin:0}#bar select{width:100%}
#who{display:flex;flex-direction:column;align-items:stretch;gap:10px;padding-top:16px;border-top:1px solid var(--line);font-size:13px}.who{min-width:0;flex:1}.who b{display:block;line-height:1.2}#who button{flex:none;white-space:nowrap;padding:7px 14px}
main{width:100%;min-width:0;max-width:1400px;margin:0 auto;padding:clamp(20px,3.5vh,40px) clamp(18px,3vw,48px) 80px}
.pagehead{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:26px}
/* events */
.ev{display:grid;grid-template-columns:76px 1fr;gap:18px;padding:20px 2px;border-top:1px solid var(--line)}

  return `<div class="pagehead"><h2>Access</h2></div><p class="hint">Everyone listed here can sign in and add, edit or delete people, events and schedules. Masters of Initiation and Senior Members from the grading sheet already have access. Trainees never do.</p>`+
  (staffList.length?staffList.map(x=>`<div class="row line r-${x.role}"><b>${esc(x.name||x.id)}</b><small>${esc(x.id)}</small><span class="sp"></span><select onchange="setStaffRole('${esc(x.id)}',this.value)">${opts(STAFF_ROLES,x.role)}</select><button onclick="rmStaff('${esc(x.id)}')">Remove</button></div>`).join(""):`<p class="empty">No one added yet.</p>`)+
  `<form class="row" onsubmit="addStaff(event)"><input name="name" placeholder="Name"><input name="email" type="email" placeholder="Email they sign in with" required><select name="role">${opts(STAFF_ROLES,"member")}</select><button class="pri">Give access</button></form>`;
}
const setStaffRole=(id,v)=>db.collection("staff").doc(id).update({role:v}).catch(fail);
function addStaff(e){e.preventDefault();const d=Object.fromEntries(new FormData(e.target));db.collection("staff").doc(d.email.trim().toLowerCase()).set({role:d.role,name:d.name.trim()}).then(()=>{e.target.reset();toast("Access given")}).catch(fail)}
function rmStaff(id){if(user&&id===user.email.toLowerCase())return toast("You can’t remove yourself");if(confirm("Remove access for "+id+"?"))db.collection("staff").doc(id).delete().catch(fail)}

// ---------- weekly calendar + schedule pictures ----------
let calPid="",schedPid="",calMode="week",calMonth=0,calDay="",calWeek=0,calA=420,picCache={};
const COLORS=["#6ea8ff","#7fd9a1","#ff8fb1","#f0c53f","#b794f6","#5fd3d3","#ffa56e","#9fd356"];
const hue=t=>{let h=0;for(const c of t)h=(h*31+c.charCodeAt(0))>>>0;return COLORS[h%COLORS.length]};
const mondayOf=o=>{const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7)+o*7);return d};
const hm=m=>String(Math.floor(m/60)).padStart(2,"0")+":00";
function weekGrid(p,ed){
  const cls=p?p.classes||[]:[];
  const mon=mondayOf(calWeek),days=[...Array(7)].map((_,i)=>{const d=new Date(mon);d.setDate(mon.getDate()+i);return d});
  const ds=days.map(iso),today=iso(new Date()),evs=events.filter(e=>ds.includes(e.date));
  let a=420,b=1260;
  cls.forEach(c=>{a=Math.min(a,Math.floor(t2m(c.start)/60)*60);b=Math.max(b,Math.ceil(t2m(c.end)/60)*60)});
  evs.forEach(e=>{a=Math.min(a,Math.floor(t2m(e.start)/60)*60);b=Math.max(b,Math.ceil(t2m(e.end)/60)*60)});
  calA=a;const H=b-a,now=new Date(),nm=now.getHours()*60+now.getMinutes();
  const times=[];for(let m=a;m<=b;m+=60)times.push(`<span style="top:${m-a}px">${t12(hm(m))}</span>`);
  const cols=days.map((d,i)=>{
    const dow=d.getDay(),s=ds[i];
    const cb=cls.filter(c=>c.days.includes(dow)).map(c=>`<div class="blk ${ed?"edit":""}" ${ed?`onclick="event.stopPropagation();classDlg('${p.id}','${c.id}')"`:""} style="top:${t2m(c.start)-a}px;height:${t2m(c.end)-t2m(c.start)}px;--c:${hue(c.subject)}"><b>${esc(c.subject)}</b>${t12(c.start)}–${t12(c.end)}${c.room?"<br>"+esc(c.room):""}</div>`).join("");
    const eb=evs.filter(e=>e.date===s).map(e=>{const clash=cls.some(c=>c.days.includes(dow)&&t2m(c.start)<t2m(e.end)&&t2m(e.start)<t2m(c.end));
      return `<div class="blk ev ${clash?"clash":""}" style="top:${t2m(e.start)-a}px;height:${t2m(e.end)-t2m(e.start)}px"><b>${esc(e.title)}</b>${t12(e.start)}–${t12(e.end)}${clash?"<br>Class conflict":""}</div>`}).join("");
    const nl=s===today&&nm>=a&&nm<=b?`<div class="now" id="nowline" style="top:${nm-a}px"></div>`:"";
    return `<div class="col ${s===today?"today":""} ${ed?"ed":""}" style="height:${H}px" ${ed?`onclick="gridAdd(event,'${p.id}',${dow},${a})"`:""}>${cb}${eb}${nl}</div>`;
  }).join("");
  const heads=days.map((d,i)=>`<div class="h ${ds[i]===today?"today":""}">${DAYS[d.getDay()]}<small>${d.toLocaleDateString("en-PH",{month:"short",day:"numeric"})}</small></div>`).join("");
  const f=o=>days[o].toLocaleDateString("en-PH",{month:"short",day:"numeric"});
  return {rng:f(0)+" – "+days[6].toLocaleDateString("en-PH",{month:"short",day:"numeric",year:"numeric"}),
    html:`<div class="calwrap"><div class="cal"><div class="h"></div>${heads}<div class="tm" style="height:${H}px">${times.join("")}</div>${cols}</div></div>`};
}
const weekNav=r=>`<div class="row"><button onclick="calWeek--;render()">‹ Prev</button><button onclick="calWeek=0;render()">This week</button><button onclick="calWeek++;render()">Next ›</button><b>${r}</b><span class="live">Live</span></div>`;
const personSelect=(pid,fn)=>`<select onchange="${fn}" aria-label="Whose schedule"><option value="">— choose a name —</option>${peopleOpts(pid)}</select>`;
function monthView(mp){
  const b=new Date();b.setDate(1);b.setMonth(b.getMonth()+calMonth);
  const y=b.getFullYear(),m=b.getMonth(),f1=new Date(y,m,1),st=new Date(f1);st.setDate(1-((f1.getDay()+6)%7));
  const today=iso(new Date()),sel=calDay||today;
  const cells=[...Array(42)].map((_,i)=>{const d=new Date(st);d.setDate(st.getDate()+i);const s=iso(d),es=events.filter(e=>e.date===s);
    return `<div class="md ${d.getMonth()!==m?"out":""} ${s===today?"today":""} ${s===sel?"sel":""}" role="button" tabindex="0" onclick="calDay='${s}';render()" onkeydown="if(event.key==='Enter')this.click()"><b>${d.getDate()}</b>${es.slice(0,3).map(e=>`<span class="chip">${t12(e.start)} ${esc(e.title)}</span>`).join("")}${es.length>3?`<small>+${es.length-3} more</small>`:""}</div>`}).join("");
  const dayEv=events.filter(e=>e.date===sel);
  return {title:b.toLocaleDateString("en-PH",{month:"long",year:"numeric"}),html:`<div class="mgrid">${["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].map(x=>`<div class="mh">${x}</div>`).join("")}${cells}</div><h3 class="sec">${dstr(sel)}</h3>`+(dayEv.length?dayEv.map(e=>evBlock(e,mp)).join(""):`<p class="empty">No events on this day.</p>`)};
}
function calView(){
  const pid=calPid||me,p=people.find(x=>x.id===pid),mp=people.find(x=>x.id===me);
  const tog=`<div class="mini"><button class="${calMode==="week"?"on":""}" onclick="calMode='week';render()">Week</button><button class="${calMode==="month"?"on":""}" onclick="calMode='month';render()">Month</button></div>`;
  if(calMode==="month"){const g=monthView(mp);
    return `<div class="pagehead"><h2>Calendar</h2><span class="sp"></span>${tog}</div><div class="row"><button onclick="calMonth--;render()">‹ Prev</button><button onclick="calMonth=0;calDay='';render()">This month</button><button onclick="calMonth++;render()">Next ›</button><b>${g.title}</b><span class="live">Live</span></div>`+g.html}
  const g=weekGrid(p,!!p&&canEdit(p.id));
  return `<div class="pagehead"><h2>Calendar</h2><span class="sp"></span>${tog}${personSelect(pid,"calPid=this.value;render()")}</div>${weekNav(g.rng)}
  ${p?`<p class="hint">${esc(p.name)}${p.course?" · "+esc(p.course):""}. Gold blocks are choir events; a red outline means it clashes with a class.</p>`:`<p class="hint">Choose a name to see a class schedule. Choir events show for everyone.</p>`}${g.html}`;
}
function schedPage(){
  const pid=schedPid||me;
  return `<div class="pagehead"><h2>Schedules</h2><span class="sp"></span>${personSelect(pid,"schedPid=this.value;render()")}</div>${schedView(pid)}`;
}
setInterval(()=>{const n=$("#nowline");if(n){const d=new Date();n.style.top=(d.getHours()*60+d.getMinutes()-calA)+"px"}},30000);

const uploadRow=pid=>`<div class="row"><label class="up"><input id="picfile" type="file" accept="image/*" multiple hidden onchange="uploadPics(this.files,'${pid}')"><span class="bt">Upload schedule picture</span></label><small>Only Masters of Initiation and Senior Members can view uploaded pictures.</small></div>`;
function compress(file){return new Promise((res,rej)=>{
  const img=new Image(),u=URL.createObjectURL(file);
  img.onerror=()=>rej(new Error("Could not read "+file.name));
  img.onload=()=>{URL.revokeObjectURL(u);let k=Math.min(1,1600/Math.max(img.width,img.height)),q=.8,d;
    for(let i=0;i<8;i++){const c=document.createElement("canvas");c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext("2d").drawImage(img,0,0,c.width,c.height);d=c.toDataURL("image/jpeg",q);if(d.length<800000)return res(d);q=Math.max(.5,q-.1);k*=.8}
    rej(new Error("Picture is too large. Try a smaller one."))};
  img.src=u})}
async function uploadPics(files,pid){
  const p=people.find(x=>x.id===pid);if(!p)return toast("Choose your name first");if(!canEdit(pid))return toast(NOEDIT);let n=0;
  for(const f of files){
    if(!f.type.startsWith("image/")){toast(f.name+" is not a picture");continue}
    try{toast("Uploading "+f.name+"…");const data=await compress(f);
      await db.collection("schedulePics").add({personId:p.id,personName:p.name,name:f.name.slice(0,80),data,createdAt:Date.now()});n++}catch(e){fail(e)}
  }
  if(n)toast(n+" picture"+(n>1?"s":"")+" uploaded");
  const i=$("#picfile");if(i)i.value="";
}
const picsSection=pid=>`<div class="card"><div class="row"><b>Uploaded schedule pictures</b><span class="sp"></span><button onclick="loadPics('${pid}')">View pictures</button></div><div id="pics" class="thumbs"></div></div>`;
async function loadPics(pid){
  const el=$("#pics");el.innerHTML="<small>Loading…</small>";
  try{const s=await db.collection("schedulePics").where("personId","==",pid).get();
    const l=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>b.createdAt-a.createdAt);picCache={};l.forEach(x=>picCache[x.id]=x);
    el.innerHTML=l.length?l.map(x=>`<img class="thumb" src="${x.data}" alt="Schedule picture" onclick="viewPic('${x.id}')">`).join(""):"<small>No pictures uploaded yet.</small>"}
  catch(e){el.innerHTML="";fail(e)}
}
function viewPic(id){const x=picCache[id];
  openDlg(`<h3>${esc(x.personName)}</h3><img src="${x.data}" alt="Schedule picture" style="width:100%;border-radius:8px"><p class="hint">${new Date(x.createdAt).toLocaleString("en-PH")}</p><div class="row"><button onclick="delPic('${id}','${x.personId}')">Delete</button><span class="sp"></span><button class="pri" onclick="closeDlg()">Close</button></div>`);
  $("#dlg").style.width="min(900px,94vw)"}
async function delPic(id,pid){if(!confirm("Delete this picture?"))return;try{await db.collection("schedulePics").doc(id).delete();closeDlg();loadPics(pid)}catch(e){fail(e)}}

// ---------- who's free ----------
function finderView(){
  return `<h2>Who’s free?</h2><div class="row"><input type="date" value="${f.date}" onchange="f.date=this.value;finderRes()"><input type="time" value="${f.start}" onchange="f.start=this.value;finderRes()"><input type="time" value="${f.end}" onchange="f.end=this.value;finderRes()"><select onchange="f.aud=this.value;finderRes();sugRes()">${opts({trainee:"Trainees",staff:"Members and officers",all:"Everyone"},f.aud)}</select></div><div id="fr"></div><h3 class="sec">Best times</h3><div class="row"><select onchange="sugDur=+this.value;sugRes()">${opts({60:"1 hour",90:"1.5 hours",120:"2 hours",180:"3 hours"},String(sugDur))}</select><small>Next 14 days, 7 AM to 9 PM, using class schedules</small></div><div id="sug"></div>`;
}
function finderRes(){
  const el=$("#fr");if(!el)return;
  if(!f.date||!f.start||!f.end||t2m(f.end)<=t2m(f.start))return el.innerHTML=`<p class="empty">Pick a date and a valid time range.</p>`;
  const g=people.filter(p=>inAud(p,f.aud)).map(p=>({p,...status(p,{...f,responses:{}})}));
  el.innerHTML=`<p><span class="ok">${g.filter(x=>x.s==="free").length} free</span> · <span class="bad">${g.filter(x=>x.s==="busy").length} busy</span></p>`+lst("Free",g.filter(x=>x.s==="free"))+lst("Busy",g.filter(x=>x.s==="busy"));
}

// ---------- announcements ----------
let anns=[],attEv="",sugDur=120;
db.collection("announcements").onSnapshot(q=>{anns=q.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.pinned?1:0)-(a.pinned?1:0)||b.createdAt-a.createdAt);render()},()=>{});
const annNew=()=>anns.some(a=>a.createdAt>(+localStorage.getItem("annSeen")||0));
function annView(){
  return `<div class="pagehead"><h2>Announcements</h2><span class="sp"></span>${role?`<button class="pri" onclick="annDlg()">New announcement</button>`:""}</div>`+
  (anns.length?anns.map(a=>`<article class="card ${a.pinned?"pin":""}"><div class="row"><h3>${esc(a.title)}</h3>${a.pinned?'<span class="tag">Pinned</span>':""}<span class="sp"></span>${role?`<button onclick="annDlg('${a.id}')">Edit</button><button onclick="delAnn('${a.id}')">Delete</button>`:""}</div><small>${esc(a.by||"")} · ${new Date(a.createdAt).toLocaleDateString("en-PH",{month:"short",day:"numeric",year:"numeric"})}</small><p class="pre">${esc(a.body)}</p></article>`).join(""):`<div class="empty"><p>No announcements yet.</p>${role?'<button class="pri" onclick="annDlg()">Post the first one</button>':""}</div>`);

function annDlg(id){
  const a=anns.find(x=>x.id===id)||{title:"",body:"",pinned:false};

function saveAnn(e,id){
  e.preventDefault();const f=new FormData(e.target),d={title:f.get("title"),body:f.get("body"),pinned:f.get("pinned")==="on",by:profile.name||user.email};
  (id?db.collection("announcements").doc(id).update(d):db.collection("announcements").add({...d,createdAt:Date.now()})).then(()=>{if(!id)notify("Announcement: "+d.title,d.body.slice(0,140));closeDlg();toast("Posted")}).catch(fail);
}
const delAnn=id=>{if(confirm("Delete this announcement?"))db.collection("announcements").doc(id).delete().catch(fail)};

// ---------- attendance ----------
const ATT={present:"Present",late:"Late",excused:"Excused",absent:"Absent"};
function attStats(pid){const c={present:0,late:0,excused:0,absent:0};events.forEach(e=>{const v=(e.attendance||{})[pid];if(v)c[v]++});const d=c.present+c.late+c.absent;return{...c,rate:d?Math.round((c.present+c.late)/d*100):null}}
const pills=c=>`<div class="row">${Object.entries(ATT).map(([k,l])=>`<span class="pillb a-${k}">${l} <b>${c[k]||0}</b></span>`).join("")}${c.rate!=null?`<span class="pillb">Rate <b>${c.rate}%</b></span>`:""}</div>`;
function attView(){
  if(!role){
    const p=people.find(x=>x.id===me);
    if(!p)return `<div class="pagehead"><h2>My attendance</h2></div><p class="empty">Choose your name under “I am” to see your attendance.</p>`;
    const rec=events.filter(e=>(e.attendance||{})[me]).reverse();
    return `<div class="pagehead"><h2>My attendance</h2><small>${esc(p.name)}</small></div>${pills(attStats(me))}`+(rec.length?rec.map(e=>`<div class="row line"><b>${esc(e.title)}</b><small>${dstr(e.date)}</small><span class="sp"></span><span class="pillb a-${e.attendance[me]}">${ATT[e.attendance[me]]}</span></div>`).join(""):`<p class="empty">No attendance recorded for you yet.</p>`);
  }
  if(!events.length)return `<div class="pagehead"><h2>Attendance</h2></div><p class="empty">Create an event first, then take attendance here.</p>`;
  const t=iso(new Date()),ev=events.find(e=>e.id===attEv)||[...events].reverse().find(e=>e.date<=t)||events[0];
  const att=ev.attendance||{},grp=people.filter(p=>inAud(p,ev.audience)),cnt={};grp.forEach(p=>{if(att[p.id])cnt[att[p.id]]=(cnt[att[p.id]]||0)+1});
  const sel=`<select onchange="attEv=this.value;render()">${[...events].reverse().map(e=>`<option value="${e.id}" ${e.id===ev.id?"selected":""}>${dstr(e.date)} · ${esc(e.title)}</option>`).join("")}</select>`;
  const row=p=>`<div class="row line r-${p.role||"trainee"}"><span>${esc(p.name)}</span><span class="sp"></span>${Object.entries(ATT).map(([k,l])=>`<button class="att ${att[p.id]===k?"on a-"+k:""}" onclick="mark('${ev.id}','${p.id}','${k}')">${l}</button>`).join("")}</div>`;
  const all=people.map(p=>({p,...attStats(p.id)})).filter(x=>x.present+x.late+x.excused+x.absent>0);
  return `<div class="pagehead"><h2>Attendance</h2><span class="sp"></span>${sel}</div>${pills(cnt)}<div class="row"><button onclick="markAll('${ev.id}')">Mark everyone unmarked as present</button><button onclick="evCsv('${ev.id}')">Export</button></div>`+
  (grp.length?RORDER.map(r=>{const g=grp.filter(p=>(p.role||"trainee")===r);return g.length?`<h3 class="sec rolehead">${RPLURAL[r]}<span>${g.length}</span></h3>`+g.map(row).join(""):""}).join(""):`<p class="empty">No one in this event’s audience yet.</p>`)+
  (all.length?`<h3 class="sec">Overall record</h3>`+all.map(x=>`<div class="row line r-${x.p.role||"trainee"}"><span>${esc(x.p.name)}</span><span class="sp"></span><small>P ${x.present} · L ${x.late} · E ${x.excused} · A ${x.absent}</small><b>${x.rate==null?"–":x.rate+"%"}</b></div>`).join(""):"");
}
function mark(eid,pid,v){const ev=events.find(x=>x.id===eid),cur=(ev.attendance||{})[pid];db.collection("events").doc(eid).update({["attendance."+pid]:cur===v?firebase.firestore.FieldValue.delete():v}).catch(fail)}
function markAll(eid){const ev=events.find(x=>x.id===eid),a={...(ev.attendance||{})};people.filter(p=>inAud(p,ev.audience)).forEach(p=>{if(!a[p.id])a[p.id]="present"});db.collection("events").doc(eid).update({attendance:a}).then(()=>toast("Done")).catch(fail)}

// ---------- best times ----------
const hm2=m=>String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0");
function sugRes(){
  const el=$("#sug");if(!el)return;
  const grp=people.filter(p=>inAud(p,f.aud)),out=[],n=new Date(),nm=n.getHours()*60+n.getMinutes();
  if(!grp.length){el.innerHTML=`<p class="empty">No one in this group yet.</p>`;return}
  for(let k=0;k<14;k++){const d=new Date();d.setDate(d.getDate()+k);const ds=iso(d);
    for(let m=420;m+sugDur<=1260;m+=30){if(k===0&&m<=nm)continue;
      const ev={date:ds,start:hm2(m),end:hm2(m+sugDur),responses:{}};
      out.push({ds,start:ev.start,end:ev.end,free:grp.filter(p=>status(p,ev).s==="free").length})}}
  out.sort((a,b)=>b.free-a.free||(a.ds+a.start).localeCompare(b.ds+b.start));
  const pick=[];for(const o of out){if(pick.some(q=>q.ds===o.ds&&t2m(q.start)<t2m(o.end)&&t2m(o.start)<t2m(q.end)))continue;pick.push(o);if(pick.length>=6)break}
  el.innerHTML=pick.map(o=>`<div class="row line"><b>${dstr(o.ds)}</b><span>${t12(o.start)}–${t12(o.end)}</span><span class="${o.free===grp.length?"ok":""}">${o.free} of ${grp.length} free</span><span class="sp"></span><button onclick="useSlot('${o.ds}','${o.start}','${o.end}')">Check</button>${role?`<button class="pri" onclick="evDlg('',{date:'${o.ds}',start:'${o.start}',end:'${o.end}'})">Create event</button>`:""}</div>`).join("");
}
function useSlot(d,a,b){f.date=d;f.start=a;f.end=b;render();window.scrollTo({top:0,behavior:"smooth"})}

// ---------- downloads ----------
function save(name,type,text){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
const icsEsc=t=>String(t||"").replace(/[\\;,]/g,"\\$&").replace(/\n/g,"\\n"),icsT=(d,t)=>d.replace(/-/g,"")+"T"+t.replace(":","")+"00";
const icsOf=l=>"BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//MSEUF Concert Singers//Calendar//EN\r\n"+l.map(e=>`BEGIN:VEVENT\r\nUID:${e.id}@mseuf-cs\r\nDTSTAMP:${new Date().toISOString().replace(/[-:]/g,"").slice(0,15)}Z\r\nDTSTART:${icsT(e.date,e.start)}\r\nDTEND:${icsT(e.date,e.end)}\r\nSUMMARY:${icsEsc(e.title)}\r\nLOCATION:${icsEsc(e.venue)}\r\nDESCRIPTION:${icsEsc(e.notes)}\r\nEND:VEVENT\r\n`).join("")+"END:VCALENDAR\r\n";
const icsOne=id=>{const e=events.find(x=>x.id===id);save((e.title||"event").replace(/\W+/g,"-")+".ics","text/calendar",icsOf([e]))};
const icsAll=()=>{const t=iso(new Date()),l=events.filter(e=>e.date>=t);l.length?save("mseuf-cs-events.ics","text/calendar",icsOf(l)):toast("No upcoming events")};
const csvCell=v=>'"'+String(v??"").replace(/"/g,'""')+'"';
function evCsv(id){const ev=events.find(x=>x.id===id),rows=[["Name","Role","Course","Status","Reason","Attendance"]];
  people.filter(p=>inAud(p,ev.audience)).forEach(p=>{const st=status(p,ev);rows.push([p.name,ROLES[p.role||"trainee"],p.course||"",LBL[st.s],st.why,(ev.attendance||{})[p.id]||""])});
  save((ev.title||"event").replace(/\W+/g,"-")+"-"+ev.date+".csv","text/csv",rows.map(r=>r.map(csvCell).join(",")).join("\r\n"))}

function parseDayStr(v){
  if(Array.isArray(v))return[...new Set(v.map(x=>typeof x==="number"?x:parseDayStr(String(x))[0]).filter(x=>x>=1&&x<=6))];
  const t=String(v||"").toLowerCase().replace(/(mon|tue|wed|thu|fri|sat)[a-z]*/g,(m,a)=>({mon:"M",tue:"T",wed:"W",thu:"H",fri:"F",sat:"S"})[a]).toUpperCase().replace(/TH/g,"H").replace(/[^MTWHRFS]/g,"");
  const map={M:1,T:2,W:3,H:4,R:4,F:5,S:6};return[...new Set([...t].map(c=>map[c]))];
}
function csvRows(t,d){const rows=[];let r=[],c="",q=false;
  for(let i=0;i<t.length;i++){const ch=t[i];
    if(q){if(ch==='"'){if(t[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}
    else if(ch==='"')q=true;else if(ch===d){r.push(c);c=""}
    else if(ch==="\n"||ch==="\r"){if(ch==="\r"&&t[i+1]==="\n")i++;r.push(c);c="";if(r.some(x=>x.trim()))rows.push(r);r=[]}else c+=ch}
  r.push(c);if(r.some(x=>x.trim()))rows.push(r);return rows}
function parseSched(txt){
  txt=String(txt||"").replace(/^\uFEFF/,"").trim();const errs=[];
  if(!txt)return{rows:[],errs:["Choose a file or paste some rows first."]};
  let items=[];
  if(/^[\[{]/.test(txt)){
    try{let j=JSON.parse(txt);if(!Array.isArray(j))j=j.classes||[];items=j.map(x=>({subject:x.subject||x.name||x.title||x.course,days:x.days??x.day,start:x.start,end:x.end,time:x.time,room:x.room||x.rooms||""}))}
    catch(e){return{rows:[],errs:["That JSON could not be read."]}}
  }else{
    const first=txt.split(/\r?\n/)[0],d=first.includes("\t")?"\t":first.includes(",")?",":first.includes(";")?";":"|";
    const rows=csvRows(txt,d);let map={subject:0,days:1,start:2,end:3,room:4};
    const hdr=rows[0].map(x=>x.trim().toLowerCase());
    if(hdr.some(h=>/subject|course|description|^days?$|start|^end|room|time/.test(h))){
      map={};hdr.forEach((h,i)=>{const k=/subject|course|description|^name/.test(h)?"subject":/^days?$|schedule/.test(h)?"days":/start|from/.test(h)?"start":/^end|until|^to$/.test(h)?"end":/room/.test(h)?"room":/time/.test(h)?"time":null;if(k&&!(k in map))map[k]=i});rows.shift()}
    items=rows.map(r=>({subject:r[map.subject],days:r[map.days],start:r[map.start],end:r[map.end],time:r[map.time],room:r[map.room]}));
  }
  const rows=[];
  items.forEach((x,i)=>{const n=i+1;let a,b;
    if(x.time&&(x.start==null||x.start==="")){const m=String(x.time).split(/\s*(?:-|–|to)\s*/i);a=parseT(m[0]);b=parseT(m[1])}else{a=parseT(x.start);b=parseT(x.end)}
    const days=parseDayStr(x.days),sub=String(x.subject||"").trim();
    if(!sub)return errs.push("Row "+n+": missing subject");
    if(!days.length)return errs.push("Row "+n+" ("+sub+"): couldn’t read the days");
    if(a==null||b==null)return errs.push("Row "+n+" ("+sub+"): couldn’t read the times");
    if(b<=a&&b+720>a&&b+720<1440&&!/am|pm/i.test(String(x.end||"")))b+=720;
    if(b<=a)return errs.push("Row "+n+" ("+sub+"): end must be after start");
    rows.push({subject:sub,days,start:hm2(a),end:hm2(b),room:String(x.room||"").trim()})});
  return{rows,errs};
}

  const have=new Set(people.map(p=>p.id)),b=db.batch();let n=0;
  for(const[id,p]of Object.entries(SEED)){if(have.has(id))continue;n++;
    b.set(db.collection("people").doc(id),{name:p.n,course:p.c,role:"trainee",updatedAt:Date.now(),classes:p.l.map((r,i)=>({id:"s"+i,days:parseDays(r[0]),start:r[1],end:r[2],subject:r[3],room:r[4]||""}))})}
  if(!n)return toast("Starter schedules are already imported");
  b.commit().then(()=>toast(n+" schedules imported")).catch(fail);
}
function toggleSide(){const m=$("#shell").classList.toggle("min");localStorage.setItem("sidemin",m?"1":"0");const b=$("#min");b.setAttribute("aria-expanded",String(!m));b.title=b.ariaLabel=m?"Expand sidebar":"Minimize sidebar"}
if(localStorage.getItem("sidemin")==="1"){$("#shell").classList.add("min");$("#min").setAttribute("aria-expanded","false")}
render();
</script></body></html>
